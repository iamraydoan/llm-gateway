server:
  listen: ":8080"
  master_key: ""
upstream:
  base_url: "https://api.openai.com"
  timeout_seconds: 120
model_map:
  cheap: gpt-4o-mini
  smart: gpt-4o
  gpt-4o-mini: gpt-4o-mini
keys:
  - id: key-1
    name: "Main account"
    api_key: "sk-REPLACE-ME-1"
    proxy: ""
    priority: 1
    max_concurrency: 5
    enabled: true
    rate_limits:
      - max: 5
        window: 1m
      - max: 100
        window: 1h
  - id: key-2
    name: "Backup via proxy"
    api_key: "sk-REPLACE-ME-2"
    proxy: "http://user:pass@127.0.0.1:8081"
    priority: 2
    max_concurrency: 3
    enabled: true
    rate_limits:
      - max: 5
        window: 1m
      - max: 100
        window: 1h
  - id: key-3
    name: "High limit"
    api_key: "sk-REPLACE-ME-3"
    proxy: ""
    priority: 3
    max_concurrency: 10
    enabled: true
    rate_limits:
      - max: 20
        window: 1m
      - max: 500
        window: 1d
