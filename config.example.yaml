# llm-gateway config. Copy to config.yaml and fill in your keys.
server:
  listen: ":8080"
  # Optional: clients must send this as Bearer token. Empty = no auth.
  master_key: ""
  # Optional: max keys tried per request. On any error (429, 4xx, 5xx,
  # network) the failing key goes into cooldown backoff and the request
  # jumps to the next key immediately (no waiting). 0 = default 10.
  max_failovers: 10
  # Optional: SQLite path for request logs.
  # Default: gateway.db next to config.yaml. Env LLM_GATEWAY_DB wins.
  # db_path: "/app/data/gateway.db"

upstream:
  base_url: "https://api.openai.com"
  timeout_seconds: 120
  # Optional 9Router-style relay: requests go to this relay URL instead of
  # the upstream directly. The gateway sends x-relay-target (upstream base)
  # and x-relay-path (request path); the relay forwards method, headers and
  # body as-is. A per-key relay_url overrides this one.
  # relay_url: "https://your-relay.vercel.app"

  # Per-error actions, matched against the upstream error response body.
  # Each rule takes a JSON path (dot-separated, e.g. error.code) and the
  # value it must equal; the first matching rule wins. delay_seconds pauses
  # before the next attempt (failover/retry) of the same request, and
  # cooldown_seconds parks the failed key for that long on top of the
  # normal backoff. Set either one or both; a rule must set at least one.
  # The free-tier weekly quota error (code free_tier_limit_reached) is
  # handled built-in: the gateway parses the reset date from the error
  # message and parks the key until then, no rule needed for it.
  error_rules:
    - path: "error.code"
      value: "server_busy"
      delay_seconds: 5
      cooldown_seconds: 300

# Model mapping: requested model -> upstream model.
# Unmapped models pass through unchanged.
model_map:
  cheap: gpt-4o-mini
  smart: gpt-4o
  gpt-4o-mini: gpt-4o-mini

# Shared settings for every key below. A field set on a key itself wins
# (including enabled: false, priority: 0, max_concurrency: 0). Only fields
# set here are filled in; key_defaults must not set id, name or api_key.
key_defaults:
  priority: 1                     # lower = tried first
  max_concurrency: 5              # max in-flight requests per key, 0 = unlimited
  enabled: true
  # proxy: ""                       # shared HTTP proxy for all keys, empty = direct
  # relay_url: ""                   # shared 9Router-style relay for all keys
  rate_limits:
    - max: 5
      window: 1m
    - max: 100
      window: 1h

keys:
  # Shorthand: just the api key, everything else comes from key_defaults.
  - sk-REPLACE-ME-0

  - id: key-1
    name: "Main account"
    api_key: "sk-REPLACE-ME-1"
    proxy: ""                       # empty = direct; e.g. http://user:pass@host:port
    # relay_url: ""                   # optional: this key goes via the relay; wins over upstream.relay_url

  - id: key-2
    name: "Backup via proxy"
    api_key: "sk-REPLACE-ME-2"
    proxy: "http://user:pass@127.0.0.1:8081"
    priority: 2                     # override: tried after key-1

  - id: key-3
    name: "High limit"
    api_key: "sk-REPLACE-ME-3"
    priority: 3
    max_concurrency: 10
    relay_url: "https://your-relay.vercel.app"   # this key goes via the relay;
                                              # relay wins over proxy when both are set
    rate_limits:                    # override: this key gets its own limits
      - max: 20
        window: 1m
      - max: 500
        window: 1d
